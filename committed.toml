# conventional commits: https://www.conventionalcommits.org
# auto-discovered at the repo root by CI (crate-ci/committed action) and by
# lefthook's commit-msg hook, so both use the same rules. only values that
# diverge from committed's defaults are set.
style = "conventional"
allowed_types = ["feat", "fix", "build", "ci", "test", "docs", "refactor", "perf", "style", "chore", "revert"]
subject_capitalized = false
subject_length = 72
