# scaffold a go service, see README.md

_subdirectory: template
_min_copier_version: "9"

# copier chmods every generated file to the mode of its source, and the source
# is the nix store (444). without this `go mod tidy` and the gofmt hook die with
# permission denied. tasks are an unsafe feature, the trust entry that lets them
# run without `--trust` is in home/cli/dev.nix.
_tasks:
  - "chmod -R u+w ."

project_name:
  type: str
  help: Project name (kebab-case; used as binary & module tail)

module_path:
  type: str
  help: Go module path
  default: "github.com/fschade/{{ project_name }}"

go_version:
  type: str
  help: Go toolchain version
  default: "1.26"

description:
  type: str
  help: One-line description
  default: ""
