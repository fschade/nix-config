# scaffold a go service, see README.md

_subdirectory: template
_min_copier_version: "9"

_tasks:
  - "chmod -R u+w ."

project_name:
  type: str
  help: Project name (kebab-case; used as binary & module tail)

module_path:
  type: str
  help: Go module path
  default: "github.com/fschade/{{ project_name }}"

go_version:
  type: str
  help: Go toolchain version
  default: "1.27"

description:
  type: str
  help: One-line description
  default: ""
