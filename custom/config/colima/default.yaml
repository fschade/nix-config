# colima resource defaults for *new* instances (wired in home/cli/dev.nix as a
# read-only symlink). only takes effect on a fresh `colima start`, an existing
# VM has to be recreated (`colima delete && colima start`). managed here, so
# dont use `colima template`.
runtime: docker
vmType: vz
mountType: virtiofs
cpu: 8
memory: 8
disk: 100
# colima's default (`mounts: []`) makes the *entire* home writable. any container
# could write to ~/.ssh, ~/.aws, ~/.config, and inotify points at all of $HOME,
# which sends fseventsd into a RAM/CPU runaway.
# see https://github.com/abiosoft/colima/issues/1569
mounts:
  - location: ~/Developer
    writable: true
# ~/Developer is a large tree, propagating host inotify events for all of it
# makes fseventsd burn RAM/CPU (same issue #1569). off is fine, I/O over
# virtiofs stays fast anyway. trade-off: in-container watchers dont see host
# edits, so hot-reload needs polling (e.g. CHOKIDAR_USEPOLLING=1). colima
# defaults to false too, its spelled out so nobody flips it back on.
mountInotify: false
