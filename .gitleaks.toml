[extend]
useDefault = true

# paths are unanchored regexes, so every entry needs the `^`. without it `tmp/`
# matches any path with a tmp/ segment, not only the one at the root

[[allowlists]]
description = "IDE - gitignored"
paths = ['''^\.idea/''']

[[allowlists]]
description = "gitignored, never committed: build output, scratch, per-machine overlays"
paths = [
  '''^tools/web-app/\.build/''',
  '''^tools/web-app/\.swiftpm/''',
  '''^\.direnv/''',
  '''^dist/''',
  '''^tmp/''',
  # holds real room/invite links, gitignored, so scans must not fail on it
  '''manifest\.local\.json$''',
]
